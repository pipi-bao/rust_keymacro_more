# 键盘宏配置文件 (GUI 版)
# 
# 在 GUI 界面的"配置编辑器"中编辑此配置
# 点击"应用配置"使更改生效，或点击"保存配置"保存到文件
#
# 触发源类型（type）：
#   - keyboard: 键盘按键触发
#   - gamepad: 手柄按键触发
#
# 键盘按键名（key）：
#   - 字母: A-Z
#   - 数字: 0-9
#   - F键: F1-F12
#   - 特殊: Space, Enter, Tab, Backspace, Escape, Shift, Ctrl, Alt
#   - 符号: ` (反引号), ' (单引号)
#
# 手柄按键名（key）：
#   - 动作键: A, B, X, Y
#   - 肩键: LB, RB
#   - 扳机: LT, RT
#   - 菜单: Start, Back, Guide
#   - 摇杆: LS (左摇杆按下), RS (右摇杆按下)
#   - 方向: DUp, DDown, DLeft, DRight
#
# 延迟配置支持两种格式：
#   1. 固定延迟: delay: 17  (单位：毫秒)
#   2. 随机延迟: delay: { min: 10, max: 30 }  (在10-30毫秒之间随机)
#
# Wait 步骤支持随机等待:
#   - random: true 表示在 0 ~ value 之间随机等待
#
# 操作类型（action）：
#   - type_text: 输入文本
#   - sequence: 按键序列
#   - auto_repeat: 按键连发（DNF 风格：按住触发键，持续重复触发目标按键）
#   - hold_loop: 按住循环（按住触发键循环执行步骤，松开停止；可用 every 做定时按键）
#
# 按键连发（auto_repeat）参数说明：
#   - key: 连发时模拟的目标按键（如 "A"、"Space"）
#   - press_ms: 目标按键按下持续时间（毫秒，默认 20）
#   - release_ms: 释放后到下一次按下的间隔（毫秒，默认 30）
#   示例：按住 X 键，持续重复触发 Space 键，按下 30ms + 间隔 20ms
#   - type: keyboard
#     key: "X"
#     action: "auto_repeat"
#     params:
#       key: "Space"
#       press_ms: 30
#       release_ms: 20
#
# 鼠标操作支持：
#   - mouse_click: 鼠标点击 (button: left/right/middle)
#   - mouse_action: 鼠标按下/释放 (button: left/right/middle, action: click/down/up)
#   - mouse_move: 鼠标移动 (x, y, relative: true/false)
#   - mouse_wheel: 鼠标滚轮 (delta: 正数向上，负数向下)

hotkeys:
  # 键盘触发示例
  # - type: keyboard
  #   key: "'"
  #   action: "sequence"
  #   params:
  #     steps:
  #       - type: "key"
  #         value: "E"
  #         action: "press"
  #         delay: { min: 24, max: 48}
  #
  #       - type: "key"
  #         value: "R"
  #         action: "press"
  #         delay: { min: 14, max: 32}
  #
  #       - type: "key"
  #         value: "E"
  #         action: "release"
  #         delay: { min: 14, max: 32}
  #
  #       - type: "key"
  #         value: "T"
  #         action: "press"
  #         delay: { min: 14, max: 32}
  #
  #       - type: "key"
  #         value: "R"
  #         action: "release"
  #         delay: { min: 14, max: 32}
  #
  #       - type: "key"
  #         value: "Space"
  #         action: "press"
  #         delay: { min: 14, max: 32}
  #
  #       - type: "key"
  #         value: "K"
  #         action: "press"
  #         delay: { min: 100, max: 200}
  #
  #       - type: "key"
  #         value: "Space"
  #         action: "release"
  #         delay: 30
  #       - type: "key"
  #         value: "T"
  #         action: "release"
  #         delay: 25
  #       - type: "key"
  #         value: "K"
  #         action: "release"
  #         delay: { min: 100, max: 200}

  # 手柄 A 键触发 - 输入文本
  # - type: gamepad
  #   key: "A"
  #   action: "type_text"
  #   params:
  #     text: "Hello World"
  
  # 鼠标操作示例 - 手柄 X 键触发鼠标点击和移动
  # - type: gamepad
  #   key: "X"
  #   action: "sequence"
  #   params:
  #     steps:
  #       # 鼠标左键点击
  #       - type: "mouse_click"
  #         button: "left"
  #         delay: 100
  #       
  #       # 移动到指定坐标
  #       - type: "mouse_move"
  #         x: 500
  #         y: 300
  #         delay: 200
  #       
  #       # 鼠标拖拽操作
  #       - type: "mouse_action"
  #         button: "left"
  #         action: "down"
  #       - type: "mouse_move"
  #         x: 200
  #         y: 100
  #         relative: true
  #         delay: 500
  #       - type: "mouse_action"
  #         button: "left"
  #         action: "up"
  #       
  #       # 鼠标滚轮向上滚动
  #       - type: "mouse_wheel"
  #         delta: 120
  
  # 手柄 X：按下后立刻先发 Y，再循环 LB-RB；之后每 5 秒再发一次 Y
  # 松开 X 即停止。
  # 手柄按键通过虚拟 Xbox 360 控制器输出，需安装 ViGEmBus：
  # https://github.com/nefarius/ViGEmBus/releases
  # 游戏里请选择新出现的 Xbox 360 Controller（虚拟手柄会透传摇杆/其他实体按键，并屏蔽 X）。
  - type: gamepad
    key: "X"
    action: "hold_loop"
    params:
      steps:
        - type: key
          value: LB
          device: gamepad
          delay: 50
        - type: key
          value: RB
          device: gamepad
          delay: 50
      every:
        - key: Y
          interval_ms: 5000
          press_ms: 50
          device: gamepad
