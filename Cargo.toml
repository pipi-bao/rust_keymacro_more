[package]
name = "rust_keymacro"
version = "2.0.0"
edition = "2021"

[dependencies]
# GUI 框架
egui = "0.29"
eframe = "0.29"

# 保留原有核心依赖
global-hotkey = "0.6"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rand = "0.8"
gilrs = "0.11"
vigem-client = "0.1"
log = "0.4"
simplelog = "0.12"
serde_json = "1.0"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
]
